[package]
name = "nqueue"
version = "0.1.0"
edition = "2021"
description = "Queue system for agent-to-agent communication"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
rand = "0.8"
redis = { version = "1.8.0", default-features = false, features = ["script"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
